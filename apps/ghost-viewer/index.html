<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0c'/%3E%3Cpath d='M3 4h10L8 13z' fill='%23d9c9a3'/%3E%3C/svg%3E" />
  <title>Ghost Viewer — Pre-publish Gate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0c;
      --surface: #111115;
      --surface2: #16161a;
      --text: #e8e0d0;
      --dim: #7a7068;
      --pass: #3a7d44;
      --fail: #8b1a1a;
      --hold: #6b5a2e;
      --accent: #4a3f6b;
      --border: #2a2a30;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      min-height: 100dvh;
    }

    a { color: var(--dim); }

    /* Layout */
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      padding: 2.5rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .site-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    .site-sub {
      font-size: 0.8rem;
      color: var(--dim);
      margin-top: 0.25rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Drop zone */
    #drop-zone {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
      color: var(--dim);
      font-size: 0.9rem;
    }
    #drop-zone:hover, #drop-zone:focus-visible {
      border-color: var(--accent);
      background: rgba(74,63,107,0.08);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      color: var(--text);
    }
    #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(74,63,107,0.15);
      color: var(--text);
    }
    .drop-icon {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      opacity: 0.5;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
      align-items: center;
    }

    button {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .synthetic-label {
      font-size: 0.72rem;
      color: var(--dim);
      align-self: center;
    }

    /* Status */
    #status-line {
      min-height: 1.4em;
      font-size: 0.8rem;
      color: var(--dim);
      font-family: monospace;
      margin-top: 0.6rem;
    }

    /* Privacy notice */
    .privacy {
      font-size: 0.78rem;
      color: var(--dim);
      margin-top: 0.75rem;
    }

    /* Results */
    #verdict-area {
      margin-top: 2rem;
    }

    #contact-area {
      margin-top: 0.5rem;
    }

    /* Ledger section */
    #ledger-section {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .ledger-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 0.5rem;
    }
    #ledger-area { margin-bottom: 0.75rem; }

    /* Responsive */
    @media (max-width: 480px) {
      .btn-row { flex-direction: column; align-items: stretch; }
      button { width: 100%; }
    }

    /* Focus ring for canvas items */
    canvas:focus-visible { outline: 2px solid var(--accent); }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="site-title">Ghost Viewer</div>
      <div class="site-sub">Pre-publish gate · vertical short video</div>
    </header>

    <main>
      <div
        id="drop-zone"
        role="button"
        tabindex="0"
        aria-label="Drop a video file here or click to browse"
        aria-busy="false"
      >
        <div class="drop-icon" aria-hidden="true">▽</div>
        <div>Drop a video file here</div>
        <div style="font-size:0.75rem;margin-top:0.3rem;">or click to browse</div>
      </div>

      <div class="btn-row">
        <button id="btn-cursed" type="button">Judge the cursed sample</button>
        <button id="btn-clean" type="button">Judge the clean sample</button>
        <button id="btn-nosound" type="button">Judge a video with no sound track</button>
        <span class="synthetic-label" aria-label="These buttons use synthetic data">synthetic data — no file needed</span>
      </div>

      <div id="status-line" role="status" aria-live="polite"></div>
      <p class="privacy">The video stays in the browser. No bytes are sent to any server.</p>

      <section id="verdict-area" aria-label="Verdict"></section>
      <section id="contact-area" aria-label="Contact sheet"></section>

      <section id="ledger-section" hidden>
        <p class="ledger-title">Ledger</p>
        <div id="ledger-area" role="status" aria-live="polite"></div>
        <button id="btn-download" type="button">Download ledger as JSONL</button>
      </section>
    </main>
  </div>

  <script type="module" src="./ui.js"></script>
</body>
</html>
